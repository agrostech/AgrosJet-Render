services:
  # Backend - FastAPI
  - type: web
    name: sepettakip-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- Core (ZORUNLU) ---
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # --- Cloudflare R2 (Dosya yükleme) ---
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_BUCKET_NAME
        sync: false
      # --- SepetTakip / Adisyo bridge ---
      - key: SEPETTAKIP_API_BASE
        sync: false
      - key: SEPETTAKIP_API_KEY
        sync: false
      - key: SEPETTAKIP_COURIER_KEY
        sync: false
      - key: GETIR_WEBHOOK_API_KEY
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      # --- LLM / Maps ---
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      # --- Web Push (VAPID) ---
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

  # Frontend - React (Static Site)
  - type: web
    name: sepettakip-frontend
    runtime: static
    rootDir: frontend
    buildCommand: yarn install && CI=false yarn build
    staticPublishPath: build
    autoDeploy: true
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
      - key: REACT_APP_GOOGLE_MAPS_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
